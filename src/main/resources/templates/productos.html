<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}" />
</head>
<body>
<div class="container">
    <h1 style="text-align: center; background: linear-gradient(to right, #5D0516, #F77051); color: white; padding: 20px; border-radius: 12px 12px 0 0;">
        Lista de Productos
    </h1>

    <div class="layout-row">
        <!-- Formulario a la izquierda -->
        <form method="post" th:action="@{/productos/agregar}" class="product-form">
            <input type="text" id="input-nom" name="nombre" placeholder="Nombre del producto" required>
            <input type="number" id="input-prec" name="precio" step="0.01" placeholder="Precio" required>
            <button type="submit">Agregar</button>
        </form>

        <!-- Tabla a la derecha -->
        <table class="styled-table">
            <thead>
            <tr><th>Producto</th><th>Precio</th><th>Acción</th></tr>
            </thead>
            <tbody>
            <tr th:each="prod : ${productos}">
                <td th:text="${prod.nombre}"></td>
                <td th:text="${prod.precio}"></td>
                <td>
                    <form th:action="@{'/eliminar/' + ${prod.id}}" method="get">
                        <button type="submit" class="delete-button">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <br><a href="/" style="text-decoration: none; color: #5D0516; font-weight: bold;">Volver</a>
</div>
</body>
</html>
